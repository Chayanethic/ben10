  <text x="374" y="32" fill="#ccff88" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">TECH // TACTICIAN</text>
  <!-- Detailed Alien Vector Illustration -->
  
      <!-- Huge Galvan Cranial Lobes -->
