      <circle cx="132" cy="122" r="11" fill="#ab47bc" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="268" cy="122" r="11" fill="#ab47bc" stroke="#ffffff" stroke-width="1.5"/>
    
  <!-- Signature Omnitrix Badge -->
  <g transform="translate(200, 246)">
