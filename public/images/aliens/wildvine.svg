  <text x="26" y="32" fill="#d9ffab" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">FLORAUNA</text>
  <text x="374" y="32" fill="#88ff99" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">NATURE // CONTROLLER</text>
  <!-- Detailed Alien Vector Illustration -->
  
      <!-- Venus Flytrap Leaf Collar With Teeth -->
      <path d="M108 145 C95 85 150 55 200 72 C250 55 305 85 292 145 C278 195 245 215 200 218 C155 215 122 195 108 145 Z" fill="#2e7d32" stroke="#69f0ae" stroke-width="3.5"/>
      <!-- Whipping Vine Tendrils -->
      <path d="M95 235 Q65 180 112 155" fill="none" stroke="#43a047" stroke-width="10" stroke-linecap="round"/>
      <path d="M305 235 Q335 180 288 155" fill="none" stroke="#43a047" stroke-width="10" stroke-linecap="round"/>
      <!-- Central Single Blue/Green Florauna Eye & Head -->
      <ellipse cx="200" cy="148" rx="42" ry="52" fill="#66bb6a" stroke="#1b5e20" stroke-width="3"/>
      <circle cx="200" cy="136" r="18" fill="#00e5ff" stroke="#004d40" stroke-width="3"/>
