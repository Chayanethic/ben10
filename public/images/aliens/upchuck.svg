  <text x="374" y="32" fill="#bbff77" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">PLASMA // BLASTER</text>
  <!-- Detailed Alien Vector Illustration -->
  
      <!-- Gourmand Round Head & Belly -->
