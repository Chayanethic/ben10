  <path d="M384 40 L384 16 L356 16" fill="none" stroke="#aa66ff" stroke-width="3"/>
  <path d="M16 280 L16 304 L44 304" fill="none" stroke="#aa66ff" stroke-width="3"/>
  <path d="M384 280 L384 304 L356 304" fill="none" stroke="#aa66ff" stroke-width="3"/>
  <!-- Top Species / Element Header -->
  <text x="26" y="32" fill="#d9ffab" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">ECTONURITE</text>
  <text x="374" y="32" fill="#ddbbff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">SHADOW // INFILTRATOR</text>
  <!-- Detailed Alien Vector Illustration -->
  
      <!-- Spectral Floating Shroud -->
      <path d="M122 258 C118 150 142 62 205 65 C262 68 282 155 274 258 L246 235 L218 258 L192 235 L162 258 L142 238 Z" fill="#b0bec5" stroke="#ce93d8" stroke-width="3"/>
      <!-- Dark Phasing Seam Crack Across Face & Chest -->
      <path d="M175 72 L196 135 L178 182 L212 242" fill="none" stroke="#12081c" stroke-width="6" stroke-linecap="round"/>
