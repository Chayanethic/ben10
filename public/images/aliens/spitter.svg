      <polygon points="148,148 158,172 168,145 182,170 200,142 218,170 232,145 242,172 252,148" fill="#f0f4c3"/>
      <!-- Small Corner Eyes -->
      <circle cx="132" cy="138" r="9" fill="#ffee58" stroke="#1b3314" stroke-width="2"/>
      <circle cx="268" cy="138" r="9" fill="#ffee58" stroke="#1b3314" stroke-width="2"/>
    
  <!-- Signature Omnitrix Badge -->
  <g transform="translate(200, 246)">
    <circle cx="0" cy="0" r="16" fill="#07110a" stroke="#baff39" stroke-width="3"/>
    <polygon points="-9,-11 9,-11 3,0 9,11 -9,11 -3,0" fill="#baff39"/>
