  <text x="374" y="32" fill="#bbff66" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">BIO-ACID // BLASTER</text>
  <!-- Detailed Alien Vector Illustration -->
  
      <!-- Giant Inflated Pufferfish Spheroid Body -->
      <ellipse cx="200" cy="172" rx="96" ry="78" fill="#689f38" stroke="#c6ff00" stroke-width="3.5"/>
      <!-- Spiky Lateral Projections -->
      <polygon points="104,155 76,142 98,175" fill="#9ccc65"/>
      <polygon points="296,155 324,142 302,175" fill="#9ccc65"/>
      <polygon points="122,115 98,92 138,105" fill="#9ccc65"/>
      <polygon points="278,115 302,92 262,105" fill="#9ccc65"/>
      <!-- Huge Cavernous Slime-Blasting Mouth -->
