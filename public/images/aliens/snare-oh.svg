  <text x="374" y="32" fill="#ffdd88" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">BANDAGE // CONTROLLER</text>
  <!-- Detailed Alien Vector Illustration -->
  
      <!-- Egyptian Nemes Pharaoh Headdress & Gold Crest -->
