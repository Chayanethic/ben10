<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#44ff88" stop-opacity="0.45"/>
      <stop offset="62%" stop-color="#0b180e" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#040906" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="fireOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffee00"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#aa1100"/>
    </linearGradient>
    <pattern id="hexGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M12 0 L24 6 L24 18 L12 24 L0 18 L0 6 Z" fill="none" stroke="#44ff88" stroke-width="0.65" stroke-opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="400" height="320" fill="url(#bgGlow)"/>
  <rect width="400" height="320" fill="url(#hexGrid)"/>
