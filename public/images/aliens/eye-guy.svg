  <text x="374" y="32" fill="#aaffcc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">OPTIC // BLASTER</text>
  <!-- Detailed Alien Vector Illustration -->
  
      <!-- Large Bat-Like Opticoid Ears -->
