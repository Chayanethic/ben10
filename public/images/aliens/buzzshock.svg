<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#ffee00" stop-opacity="0.45"/>
      <stop offset="62%" stop-color="#0b180e" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#040906" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="fireOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffee00"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#aa1100"/>
    </linearGradient>
    <pattern id="hexGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M12 0 L24 6 L24 18 L12 24 L0 18 L0 6 Z" fill="none" stroke="#ffee00" stroke-width="0.65" stroke-opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="400" height="320" fill="url(#bgGlow)"/>
  <rect width="400" height="320" fill="url(#hexGrid)"/>
  <!-- Omnitrix Energy Halo -->
  <circle cx="200" cy="158" r="110" fill="none" stroke="#ffee00" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="14 7"/>
  <circle cx="200" cy="158" r="95" fill="none" stroke="#baff39" stroke-width="1.5" stroke-opacity="0.32"/>
  <!-- Corner Framing -->
  <path d="M16 40 L16 16 L44 16" fill="none" stroke="#ffee00" stroke-width="3"/>
  <path d="M384 40 L384 16 L356 16" fill="none" stroke="#ffee00" stroke-width="3"/>
  <path d="M16 280 L16 304 L44 304" fill="none" stroke="#ffee00" stroke-width="3"/>
  <path d="M384 280 L384 304 L356 304" fill="none" stroke="#ffee00" stroke-width="3"/>
  <!-- Top Species / Element Header -->
  <text x="26" y="32" fill="#d9ffab" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">NOSEDEENIAN</text>
  <text x="374" y="32" fill="#ffff88" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">ELECTRIC // SPEEDSTER</text>
  <!-- Detailed Alien Vector Illustration -->
  
      <!-- High-Voltage Lightning Arcs -->
      <polyline points="85,110 125,135 105,160 142,180" fill="none" stroke="#ffee00" stroke-width="4"/>
      <polyline points="315,110 275,135 295,160 258,180" fill="none" stroke="#ffee00" stroke-width="4"/>
      <!-- Nosedeenian Battery Body -->
      <rect x="148" y="92" width="104" height="145" rx="18" fill="#1a1a1a" stroke="#ffee00" stroke-width="4"/>
      <rect x="178" y="72" width="44" height="20" rx="4" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="2"/>
      <!-- Green Plus/Minus & Lightning Belly Emblem -->
      <polygon points="208,148 182,185 204,185 192,222 222,178 200,178" fill="#00ff44"/>
      <!-- Mischievous Glowing Green Eyes & jagged Smile -->
      <polygon points="164,118 192,126 168,136" fill="#00ff44"/>
      <polygon points="236,118 208,126 232,136" fill="#00ff44"/>
    
  <!-- Signature Omnitrix Badge -->
  <g transform="translate(200, 246)">
    <circle cx="0" cy="0" r="16" fill="#07110a" stroke="#baff39" stroke-width="3"/>
    <polygon points="-9,-11 9,-11 3,0 9,11 -9,11 -3,0" fill="#baff39"/>
  </g>
  <!-- Bottom Name Plate -->
  <rect x="44" y="276" width="312" height="28" rx="6" fill="#061009" fill-opacity="0.92" stroke="#ffee00" stroke-width="1.8"/>
  <text x="200" y="295" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="3" text-anchor="middle">BUZZSHOCK</text>
