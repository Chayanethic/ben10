<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#99cc00" stop-opacity="0.45"/>
      <stop offset="62%" stop-color="#0b180e" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#040906" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="fireOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffee00"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#aa1100"/>
    </linearGradient>
    <pattern id="hexGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M12 0 L24 6 L24 18 L12 24 L0 18 L0 6 Z" fill="none" stroke="#99cc00" stroke-width="0.65" stroke-opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="400" height="320" fill="url(#bgGlow)"/>
  <rect width="400" height="320" fill="url(#hexGrid)"/>
  <!-- Omnitrix Energy Halo -->
  <circle cx="200" cy="158" r="110" fill="none" stroke="#99cc00" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="14 7"/>
  <circle cx="200" cy="158" r="95" fill="none" stroke="#baff39" stroke-width="1.5" stroke-opacity="0.32"/>
  <!-- Corner Framing -->
  <path d="M16 40 L16 16 L44 16" fill="none" stroke="#99cc00" stroke-width="3"/>
  <path d="M384 40 L384 16 L356 16" fill="none" stroke="#99cc00" stroke-width="3"/>
  <path d="M16 280 L16 304 L44 304" fill="none" stroke="#99cc00" stroke-width="3"/>
  <path d="M384 280 L384 304 L356 304" fill="none" stroke="#99cc00" stroke-width="3"/>
  <!-- Top Species / Element Header -->
  <text x="26" y="32" fill="#d9ffab" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">LEPIDOPTERRAN</text>
  <text x="374" y="32" fill="#ddff44" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">BIO-ACID // SPECIALIST</text>
  <!-- Detailed Alien Vector Illustration -->
  
      <!-- Four Insectoid Translucent Wings -->
      <ellipse cx="115" cy="135" rx="68" ry="28" transform="rotate(-22 115 135)" fill="#c6ff00" fill-opacity="0.38" stroke="#d4ff44" stroke-width="2.5"/>
      <ellipse cx="285" cy="135" rx="68" ry="28" transform="rotate(22 285 135)" fill="#c6ff00" fill-opacity="0.38" stroke="#d4ff44" stroke-width="2.5"/>
      <ellipse cx="122" cy="188" rx="56" ry="22" transform="rotate(14 122 188)" fill="#aeea00" fill-opacity="0.32" stroke="#ccff33" stroke-width="2"/>
      <ellipse cx="278" cy="188" rx="56" ry="22" transform="rotate(-14 278 188)" fill="#aeea00" fill-opacity="0.32" stroke="#ccff33" stroke-width="2"/>
      <!-- Four Orange Eye-Stalks -->
      <g stroke="#2e4c1e" stroke-width="7" stroke-linecap="round">
        <line x1="175" y1="132" x2="138" y2="78"/><line x1="185" y1="142" x2="145" y2="108"/>
        <line x1="225" y1="132" x2="262" y2="78"/><line x1="215" y1="142" x2="255" y2="108"/>
      </g>
      <circle cx="138" cy="78" r="10" fill="#ff9100" stroke="#ffffff" stroke-width="2"/>
      <circle cx="145" cy="108" r="9" fill="#ff9100" stroke="#ffffff" stroke-width="2"/>
      <circle cx="262" cy="78" r="10" fill="#ff9100" stroke="#ffffff" stroke-width="2"/>
      <circle cx="255" cy="108" r="9" fill="#ff9100" stroke="#ffffff" stroke-width="2"/>
      <!-- Insectoid Head & Thorax -->
      <ellipse cx="200" cy="168" rx="34" ry="44" fill="#4caf50" stroke="#ccff33" stroke-width="3"/>
      <path d="M162 265 L176 205 L224 205 L238 265 Z" fill="#1b301b" stroke="#99cc00" stroke-width="2.5"/>
    
  <!-- Signature Omnitrix Badge -->
  <g transform="translate(200, 246)">
    <circle cx="0" cy="0" r="16" fill="#07110a" stroke="#baff39" stroke-width="3"/>
    <polygon points="-9,-11 9,-11 3,0 9,11 -9,11 -3,0" fill="#baff39"/>
  </g>
