  <rect x="44" y="276" width="312" height="28" rx="6" fill="#061009" fill-opacity="0.92" stroke="#99cc00" stroke-width="1.8"/>
  <text x="200" y="295" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="3" text-anchor="middle">STINKFLY</text>
