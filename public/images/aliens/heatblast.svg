  <text x="374" y="32" fill="#ffaa00" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">FIRE // BLASTER</text>
  <!-- Detailed Alien Vector Illustration -->
  
      <!-- Flaming Corona Aura -->
